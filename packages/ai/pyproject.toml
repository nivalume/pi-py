[project]
name = "pi-ai"
version = "1.3.0"
description = "Unified LLM API with automatic model discovery, provider auth, streaming events, and token/cost tracking (Python port of @earendil-works/pi-ai)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "nivalume" }]
keywords = ["ai", "llm", "openai", "anthropic", "gemini", "bedrock", "unified", "api", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    # Official vendor SDKs, as used by the TypeScript package.
    "anthropic>=1.15",
    "openai>=3.35",
    "google-genai>=2.31",
]

[project.optional-dependencies]
# orjson speeds up SSE/JSON decoding on the streaming hot path.
fast = ["orjson>=3.10"]
# WebSocket transport for OpenAI Codex Responses.
websocket = ["websockets>=13"]
# Pydantic models as tool parameter schemas.
pydantic = ["pydantic>=2.6"]
# Amazon Bedrock (bedrock-converse-stream) through the AWS SDK.
bedrock = ["boto3>=1.43"]
all = ["orjson>=3.10", "websockets>=13", "pydantic>=2.6", "boto3>=1.43"]

[project.scripts]
pi-ai = "pi_ai.cli:main"

[project.urls]
Homepage = "https://github.com/nivalume/pi-py"
Upstream = "https://github.com/earendil-works/pi"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_ai"]
