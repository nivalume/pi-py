[project]
name = "pi-agent-core"
version = "1.3.0"
description = "Stateful agent with tool execution, steering/follow-up queues, and event streaming, built on pi-ai (Python port of @earendil-works/pi-agent-core)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "nivalume" }]
keywords = ["ai", "agent", "llm", "tools", "state-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["pi-ai==1.3.0"]

[project.urls]
Homepage = "https://github.com/nivalume/pi-py"
Upstream = "https://github.com/earendil-works/pi"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent"]
