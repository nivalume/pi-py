[project]
name = "pi-py-workspace"
version = "0.0.0"
description = "Workspace root for the Python port of pi (pi-ai and pi-agent-core)"
requires-python = ">=3.11"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/ai", "packages/agent"]

[tool.uv.sources]
pi-ai = { workspace = true }
pi-agent-core = { workspace = true }

[dependency-groups]
dev = [
    "pi-ai[fast,websocket,bedrock]",
    "pi-agent-core",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pydantic>=2.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/ai/tests", "packages/agent/tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["packages/ai/src", "packages/agent/src"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PERF"]
ignore = [
    "E501",   # long lines are allowed in docstrings and messages
    "B008",   # dataclass field defaults
    "RUF012", # mutable class attributes in dataclasses are intentional
    "SIM108", # explicit if/else reads better in protocol code
    "RUF022", # __all__ is grouped by topic, not sorted
    "PERF203",
    "PERF401", # explicit loops are clearer in message conversion code
    "SIM102",  # nested conditions mirror the upstream control flow
    "SIM105",
    "ASYNC240", # tiny filesystem checks in auth contexts
    "RUF023",   # __slots__ follow field order
    "PERF403",
]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["ASYNC109", "ASYNC110", "RUF043"]

[tool.ruff.lint.isort]
known-first-party = ["pi_ai", "pi_agent"]

[tool.pyright]
include = ["packages/ai/src", "packages/agent/src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportPrivateUsage = false
reportMissingModuleSource = false
