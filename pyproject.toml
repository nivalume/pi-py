[project]
name = "pi-ai-python"
version = "1.3.0"
description = "Python port of pi's AI libraries: a unified LLM API (pi_ai) and a stateful agent runtime (pi_agent)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nivalume" }]
keywords = ["ai", "llm", "agent", "openai", "anthropic", "gemini", "bedrock", "streaming", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    # Official vendor SDKs, as used by the TypeScript packages.
    "anthropic>=1.15",
    "openai>=3.35",
    "google-genai>=2.31",
]

[project.optional-dependencies]
# orjson speeds up SSE/JSON decoding on the streaming hot path.
fast = ["orjson>=3.10"]
# WebSocket transport for OpenAI Codex Responses.
websocket = ["websockets>=13"]
# Pydantic models as tool parameter schemas.
pydantic = ["pydantic>=2.6"]
# Amazon Bedrock (bedrock-converse-stream) through the AWS SDK.
bedrock = ["boto3>=1.43"]
all = ["orjson>=3.10", "websockets>=13", "pydantic>=2.6", "boto3>=1.43"]

[project.scripts]
pi-ai = "pi_ai.cli:main"

[project.urls]
Homepage = "https://github.com/nivalume/pi-py"
Source = "https://github.com/nivalume/pi-py"
Upstream = "https://github.com/earendil-works/pi"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One distribution, two import packages.
packages = [
    "packages/ai/src/pi_ai",
    "packages/agent/src/pi_agent",
    "packages/chord/src/pi_chord",
    "packages/durable/src/pi_durable",
]

[tool.hatch.build.targets.sdist]
include = [
    "packages/ai/src",
    "packages/agent/src",
    "packages/chord/src",
    "packages/durable/src",
    "packages/ai/tests",
    "packages/agent/tests",
    "packages/chord/tests",
    "packages/durable/tests",
    "packages/ai/README.md",
    "packages/agent/README.md",
    "README.md",
    "README.zh-CN.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "orjson>=3.10",
    "websockets>=13",
    "boto3>=1.43",
    "pydantic>=2.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/ai/tests", "packages/agent/tests", "packages/chord/tests", "packages/durable/tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["packages/ai/src", "packages/agent/src", "packages/chord/src", "packages/durable/src"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PERF"]
ignore = [
    "E501",   # long lines are allowed in docstrings and messages
    "B008",   # dataclass field defaults
    "RUF012", # mutable class attributes in dataclasses are intentional
    "SIM108", # explicit if/else reads better in protocol code
    "RUF022", # __all__ is grouped by topic, not sorted
    "PERF203",
    "PERF401", # explicit loops are clearer in message conversion code
    "SIM102",  # nested conditions mirror the upstream control flow
    "SIM105",
    "ASYNC240", # tiny filesystem checks in auth contexts
    "RUF023",   # __slots__ follow field order
    "PERF403",
]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["ASYNC109", "ASYNC110", "RUF043"]

[tool.ruff.lint.isort]
known-first-party = ["pi_ai", "pi_agent", "pi_chord", "pi_durable"]

[tool.pyright]
include = ["packages/ai/src", "packages/agent/src", "packages/chord/src", "packages/durable/src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportPrivateUsage = false
reportMissingModuleSource = false
